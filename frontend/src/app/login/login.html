<section class="auth-card">
  <h2>Log in</h2>
  <p *ngIf="message" [ngClass]="'message-' + messageType">{{ message }}</p>
  <label>
    <span>Email</span>
    <input [(ngModel)]="email" name="email" type="email" placeholder="Email" (input)="clearMessage()">
  </label>
  <label>
    <span>Password</span>
    <input [(ngModel)]="password" name="password" type="password" placeholder="Password" (input)="clearMessage()">
  </label>
  <button type="button" (click)="onLogin()">Log in</button>
  <a routerLink="/signup" class="auth-link">Create a new account</a>
</section>
