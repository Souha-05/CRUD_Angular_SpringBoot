<section class="auth-card">
  <h2>Sign up</h2>
  <p *ngIf="message" [ngClass]="'message-' + messageType">{{ message }}</p>
  <label>
    <span>First name</span>
    <input [(ngModel)]="firstName" name="firstName" type="text" placeholder="First name" (input)="clearMessage()">
  </label>
  <label>
    <span>Last name</span>
    <input [(ngModel)]="lastName" name="lastName" type="text" placeholder="Last name" (input)="clearMessage()">
  </label>
  <label>
    <span>Email</span>
    <input [(ngModel)]="email" name="email" type="email" >
  </label>
  <label>
    <span>Password</span>
    <input [(ngModel)]="password" name="password" type="password" placeholder="Password" (input)="clearMessage()">
  </label>
  <button type="button" (click)="onSignup()">Sign up</button>
  <a routerLink="/login" class="auth-link">Already have an account? Log in</a>
</section>
